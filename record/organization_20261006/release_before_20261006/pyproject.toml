[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lesion-fpga"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=10", "opencv-python-headless>=4.8"]

[project.optional-dependencies]
train = ["torch>=2.2"]
test = ["pytest>=8"]
board = ["evdev>=1.7"]

[tool.setuptools.packages.find]
where = ["software"]

[tool.pytest.ini_options]
pythonpath = ["software"]
testpaths = ["tests"]
